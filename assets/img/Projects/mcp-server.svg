<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img"
  aria-label="Read-only SQL MCP Server">
  <defs>
    <linearGradient id="bgMcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140b24" />
      <stop offset="100%" stop-color="#2c1b5a" />
    </linearGradient>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9b8cf0" />
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bgMcp)" />

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="38" y="72" fill="#ffffff" font-size="43" font-weight="700">Read-Only SQL MCP Server</text>
    <text x="42" y="110" fill="#9b8cf0" font-size="20">Secure AI access to production data</text>

    <rect x="34" y="132" width="1132" height="592" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#9b8cf0"
      stroke-opacity="0.28" stroke-width="2" />

    <g text-anchor="middle">
      <rect x="64" y="200" width="300" height="130" rx="12" fill="#1e1440" stroke="#9b8cf0" stroke-width="2" />
      <text x="214" y="255" fill="#ffffff" font-size="25" font-weight="600">AI Agent</text>
      <text x="214" y="290" fill="#9b8cf0" font-size="17">asks a business question</text>

      <rect x="450" y="200" width="300" height="130" rx="12" fill="#1e1440" stroke="#9b8cf0" stroke-width="2" />
      <text x="600" y="255" fill="#ffffff" font-size="25" font-weight="600">MCP Server</text>
      <text x="600" y="290" fill="#9b8cf0" font-size="17">verifies the signature</text>

      <rect x="836" y="200" width="300" height="130" rx="12" fill="#1e1440" stroke="#9b8cf0" stroke-width="2" />
      <text x="986" y="255" fill="#ffffff" font-size="25" font-weight="600">PostgreSQL</text>
      <text x="986" y="290" fill="#9b8cf0" font-size="17">read-only transaction</text>
    </g>

    <g stroke="#9b8cf0" stroke-width="3" fill="none">
      <path d="M368 265 H 442" marker-end="url(#flecha)" />
      <path d="M754 265 H 828" marker-end="url(#flecha)" />
    </g>

    <g font-size="19" fill="#c3b9f5">
      <circle cx="76" cy="410" r="5" fill="#9b8cf0" />
      <text x="98" y="417">Per-request HMAC-SHA256 signature</text>

      <circle cx="76" cy="460" r="5" fill="#9b8cf0" />
      <text x="98" y="467">Nonce-based replay protection</text>

      <circle cx="76" cy="510" r="5" fill="#9b8cf0" />
      <text x="98" y="517">Table-level access scopes</text>

      <circle cx="76" cy="560" r="5" fill="#9b8cf0" />
      <text x="98" y="567">Read-only transactions enforced by PostgreSQL, not by convention</text>

      <circle cx="76" cy="610" r="5" fill="#9b8cf0" />
      <text x="98" y="617">No write path exists, even if the credentials leak</text>
    </g>
  </g>
</svg>
