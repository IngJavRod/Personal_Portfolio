<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img"
  aria-label="Payments and API integrations">
  <defs>
    <linearGradient id="bgInt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241206" />
      <stop offset="100%" stop-color="#5a3312" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgInt)" />

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="38" y="72" fill="#ffffff" font-size="43" font-weight="700">Payments &amp; API Integrations</text>
    <text x="42" y="110" fill="#f0ab5c" font-size="20">REST APIs &#160;.&#160; Webhooks &#160;.&#160; Data pipelines</text>

    <rect x="34" y="132" width="1132" height="592" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f0ab5c"
      stroke-opacity="0.28" stroke-width="2" />

    <g text-anchor="middle">
      <rect x="64" y="180" width="244" height="120" rx="12" fill="#33200c" stroke="#f0ab5c" stroke-opacity="0.65" stroke-width="2" />
      <text x="186" y="228" fill="#ffffff" font-size="24" font-weight="600">Conekta</text>
      <text x="186" y="262" fill="#f0ab5c" font-size="17">card &#183; OXXO &#183; SPEI</text>

      <rect x="340" y="180" width="244" height="120" rx="12" fill="#33200c" stroke="#f0ab5c" stroke-opacity="0.65" stroke-width="2" />
      <text x="462" y="228" fill="#ffffff" font-size="24" font-weight="600">Mercado Pago</text>
      <text x="462" y="262" fill="#f0ab5c" font-size="17">storefront checkout</text>

      <rect x="616" y="180" width="244" height="120" rx="12" fill="#33200c" stroke="#f0ab5c" stroke-opacity="0.65" stroke-width="2" />
      <text x="738" y="228" fill="#ffffff" font-size="24" font-weight="600">Google Ads</text>
      <text x="738" y="262" fill="#f0ab5c" font-size="17">up to 1M records</text>

      <rect x="892" y="180" width="244" height="120" rx="12" fill="#33200c" stroke="#f0ab5c" stroke-opacity="0.65" stroke-width="2" />
      <text x="1014" y="228" fill="#ffffff" font-size="24" font-weight="600">WhatsApp</text>
      <text x="1014" y="262" fill="#f0ab5c" font-size="17">~15 self-hosted instances</text>
    </g>

    <g font-size="19" fill="#e3c5a3">
      <circle cx="76" cy="378" r="5" fill="#f0ab5c" />
      <text x="98" y="385">Payment links and charges, end to end</text>

      <circle cx="76" cy="428" r="5" fill="#f0ab5c" />
      <text x="98" y="435">Webhooks with signature validation and idempotent processing</text>

      <circle cx="76" cy="478" r="5" fill="#f0ab5c" />
      <text x="98" y="485">Automated recurring billing via cron</text>

      <circle cx="76" cy="528" r="5" fill="#f0ab5c" />
      <text x="98" y="535">Anti-double-charge concurrency guards (SELECT ... FOR UPDATE)</text>

      <circle cx="76" cy="578" r="5" fill="#f0ab5c" />
      <text x="98" y="585">Python pipelines: E.164 normalization &#183; hashing &#183; dedupe</text>

      <circle cx="76" cy="628" r="5" fill="#f0ab5c" />
      <text x="98" y="635">WhatsApp stack migrated off a paid gateway to self-hosted AWS</text>
    </g>
  </g>
</svg>
